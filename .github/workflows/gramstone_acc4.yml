name: Auto Gramstone ($TON / $GRAM) 24/7 - Acc 4 (Belinnh2k)

on:
  schedule:
    # Chạy mỗi 6 tiếng để duy trì liên tục keepalive
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: gramstone-acc4-run
  cancel-in-progress: true

jobs:
  run-gramstone:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          echo "Staggering 5s to prevent Telegram IP collision..."
          sleep 5
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Gramstone 24/7 (Acc 4 - Belinnh2k)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GITHUB_REPOSITORY: "auo-ele/gramstone-ecosystem"
          WORKFLOW_FILE: "gramstone_acc4.yml"
          MAX_RUNTIME_SECONDS: "17500"
          RUN_247: "1"
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_API_ID: "34333329"
          TELEGRAM_API_HASH: "4f9371f95000578c84dbc670aaf1f819"
          TELEGRAM_STRING_SESSION: "1BVtsOMMBu6WXSbH0pQyd4FdW0Fc-zqEWvx3RMUB53LJeKWWB6t61lV-p3TcR3k2psUxcUtbmfdeC1jATK8f7i5jIX_eiplenW3A-h9ALZB7cq9PodKB_KJP4fhOMNeb43G8H7SbF5hDnrdPOiFMEYS1tbjOrmzNu_UyzNe64ndfKb9SSpsTZtrKbo3ryx4x7gpXHrrfISsyMUm6gOjEl9KbyvWCt94yu_spYicw2YsAGCMlKmEYqGIIIpItqZ4VJrdwPtzS__VudhSQzwM56cZMwgTsicw0NA_zaRmgZ4sJEU0ADeMMutBhDtL-kQsJQUb145Ybagpel5xAK86xAKjaeQau5R1I="
        run: python auto_gramstone.py
